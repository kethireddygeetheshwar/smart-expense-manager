server:
  port: ${PORT:8080}

spring:
  application:
    name: smart-expense-manager
  datasource:
    url: jdbc:postgresql://localhost:5432/expense_manager
    username: postgres
    password: Mahaganapathi@4
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: mySecretKeyForJWTTokenGenerationThatIsLongEnoughForHS512Algorithm123456789
    expiration-ms: 86400000
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      model: gpt-4o-mini
      base-url: https://api.openai.com/v1

logging:
  level:
    com.expense.manager: DEBUG
    org.springframework.security: INFO
